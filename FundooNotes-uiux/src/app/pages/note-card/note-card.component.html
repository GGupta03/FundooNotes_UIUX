<!-- GOOGLE KEEP CREATE NOTE -->
<div class="create-note" 
     [class.expanded]="isExpanded"
     (click)="expandBox()" 
     [style.backgroundColor]="selectedColor">
  
  <!-- Title input - only shows in expanded mode -->
  <input *ngIf="isExpanded" 
         class="note-input title-input" 
         type="text" 
         placeholder="Title" 
         [(ngModel)]="title"
         (click)="$event.stopPropagation()">

  <!-- Main content row -->
  <div class="note-row">
    <textarea 
      class="note-input desc-input" 
      [placeholder]="isExpanded ? 'Take a note...' : 'Take a note...'"
      [(ngModel)]="description" 
      [rows]="isExpanded ? 3 : 1"
      (click)="$event.stopPropagation()"></textarea>
    
    <!-- Icons for collapsed state -->
    <div class="note-icons" *ngIf="!isExpanded">
      <span class="material-symbols-outlined icon-btn" title="New list">check_box</span>
      <span class="material-symbols-outlined icon-btn" title="New note with drawing">brush</span>
      <span class="material-symbols-outlined icon-btn" title="New note with image">image</span>
    </div>
  </div>

  <!-- Expanded mode content -->
  <div *ngIf="isExpanded" (click)="$event.stopPropagation()">
    <!-- Image preview -->
    <div class="image-preview" *ngIf="imagePreview">
      <img [src]="imagePreview" alt="Preview">
      <span class="remove-image" (click)="removeImage()">&times;</span>
    </div>

    <!-- Bottom toolbar -->
    <div class="note-toolbar">
      <div class="toolbar-left">
        <!-- Main actions -->
        <span class="material-symbols-outlined icon-btn" title="Remind me">notifications</span>
        <span class="material-symbols-outlined icon-btn" title="Collaborator">person_add</span>
        <span class="material-symbols-outlined icon-btn" title="Background options">palette</span>
        
        <label for="image-upload" class="icon-btn image-label">
          <span class="material-symbols-outlined" title="Add image">image</span>
          <input type="file" 
                 id="image-upload" 
                 accept="image/*" 
                 (change)="onImageSelected($event)" 
                 style="display: none">
        </label>
        
        <span class="material-symbols-outlined icon-btn" title="Archive">archive</span>
        <span class="material-symbols-outlined icon-btn" title="More">more_vert</span>
        
        <!-- Divider -->
        <div class="divider"></div>
        
        <!-- Undo/Redo -->
        <span class="material-symbols-outlined icon-btn" title="Undo">undo</span>
        <span class="material-symbols-outlined icon-btn" title="Redo">redo</span>
        
        <!-- Divider -->
        <div class="divider"></div>
        
        <!-- Formatting -->
        <span class="material-symbols-outlined icon-btn" title="Text formatting">format_size</span>
      </div>
      
      <button class="close-btn" (click)="saveAndClose()">Close</button>
    </div>
  </div>
</div>

<!-- NOTES GRID -->
<div class="notes-container">
  <div class="notes-grid" *ngIf="notes && notes.length > 0">
    <div class="note-item" 
         *ngFor="let note of notes" 
         [style.backgroundColor]="note.color || '#ffffff'">
      
      <!-- Pin indicator -->
      <span class="pin-icon material-symbols-outlined" *ngIf="note.isPinned">push_pin</span>
      
      <!-- Note content -->
      <div class="note-content" (click)="editNote(note, $event)">
        <h3 class="note-title" *ngIf="note.title && note.title.trim()">{{ note.title }}</h3>
        <p class="note-description" *ngIf="note.content">{{ note.content }}</p>
      </div>
      
      <!-- Note footer (visible on hover) -->
      <div class="note-footer-hover">
        <span class="material-symbols-outlined icon-btn-small" 
              (click)="$event.stopPropagation()" 
              title="Remind me">notifications</span>
        <span class="material-symbols-outlined icon-btn-small" 
              (click)="$event.stopPropagation()" 
              title="Collaborator">person_add</span>
        <span class="material-symbols-outlined icon-btn-small" 
              (click)="$event.stopPropagation()" 
              title="Background options">palette</span>
        <span class="material-symbols-outlined icon-btn-small" 
              (click)="$event.stopPropagation()" 
              title="Add image">image</span>
        <span class="material-symbols-outlined icon-btn-small" 
              (click)="archiveNote(note.id, $event)" 
              title="Archive">archive</span>
        <span class="material-symbols-outlined icon-btn-small" 
              (click)="deleteNote(note.id, $event)" 
              title="Delete">delete</span>
      </div>
    </div>
  </div>
  
  <!-- Empty state -->
  <div class="empty-state" *ngIf="!notes || notes.length === 0">
    <span class="material-symbols-outlined empty-icon">lightbulb</span>
    <p class="empty-text">Notes you add appear here</p>
  </div>
</div>

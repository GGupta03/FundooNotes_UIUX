<div class="auth-wrapper">
  <div class="auth-card">

    <img class="google-logo" src="assets/images/google-logo.png" alt="Google Logo" />

    <div class="title">Reset Password</div>
    <div class="subtitle">Recover your account</div>

    <div *ngIf="errorMessage" style="color: #d32f2f; margin-bottom: 15px; padding: 10px; background-color: #ffebee; border-radius: 4px;">
      ⚠️ {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" style="color: #388e3c; margin-bottom: 15px; padding: 10px; background-color: #f1f8e9; border-radius: 4px;">
      ✓ {{ successMessage }}
    </div>

    <!-- Step 1: Enter Email -->
    <div *ngIf="step === 'email'">
      <div class="input-group">
        <input 
          class="auth-input" 
          type="email" 
          placeholder="Enter your email*"
          [(ngModel)]="email"
          [disabled]="isLoading"
        />
      </div>

      <div class="bottom-row">
        <a class="link-blue" routerLink="/login">Back to login</a>

        <button class="login-btn" (click)="onRequestOtp()" [disabled]="isLoading">
          {{ isLoading ? 'Sending...' : 'Send OTP' }}
        </button>
      </div>
    </div>

    <!-- Step 2: Verify OTP -->
    <div *ngIf="step === 'otp'">
      <div class="input-group">
        <input 
          class="auth-input" 
          type="text" 
          placeholder="Enter 6-digit OTP*"
          [(ngModel)]="otp"
          [disabled]="isLoading"
          maxlength="6"
        />
      </div>

      <div style="font-size: 12px; color: #666; margin-bottom: 15px;">
        Check your email for the OTP code
      </div>

      <div class="bottom-row">
        <button class="login-btn" (click)="onVerifyOtp()" [disabled]="isLoading">
          {{ isLoading ? 'Verifying...' : 'Verify OTP' }}
        </button>
      </div>
    </div>

    <!-- Step 3: Set New Password -->
    <div *ngIf="step === 'password'">
      <div class="input-group">
        <input 
          class="auth-input" 
          type="password" 
          placeholder="New Password*"
          [(ngModel)]="newPassword"
          [disabled]="isLoading"
        />
        <input 
          class="auth-input" 
          type="password" 
          placeholder="Confirm Password*"
          [(ngModel)]="confirmPassword"
          [disabled]="isLoading"
        />
      </div>

      <div style="font-size: 12px; color: #666; margin-bottom: 15px;">
        Use 6 or more characters
      </div>

      <div class="bottom-row">
        <button class="login-btn" (click)="onResetPassword()" [disabled]="isLoading">
          {{ isLoading ? 'Resetting...' : 'Reset Password' }}
        </button>
      </div>
    </div>

  </div>
</div>

<div class="register-wrapper">
  <mat-card class="register-card">

    <!-- LEFT SIDE -->
    <div class="register-left">

      <!-- Branding -->
      <div class="brand register-brand">
        <img class="brand-logo" src="assets/images/fundoo-logo.png" alt="FundooNotes Logo" />
        <div class="brand-name">FundooNotes</div>
      </div>

      <div class="register-title">Create your Google Account</div>

      <!-- FORM -->
      <form class="register-form">

        <div class="row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>First Name <span class="required">*</span></mat-label>
            <input matInput />
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Last Name <span class="required">*</span></mat-label>
            <input matInput />
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email <span class="required">*</span></mat-label>
          <input matInput />
        </mat-form-field>

        <div class="helper-text">You can use letters, numbers & periods</div>
        <a class="link-blue" href="#">Use my current email instead</a>

        <div class="row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Password <span class="required">*</span></mat-label>
            <input matInput type="password" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Confirm <span class="required">*</span></mat-label>
            <input matInput type="password" />
          </mat-form-field>
        </div>

        <div class="helper-text">
          Use 8 or more characters with a mix of letters, numbers & symbols
        </div>

        <mat-checkbox class="show-pass">Show Password</mat-checkbox>

        <!-- Bottom Row -->
        <div class="bottom-row">
          <a class="link-blue" routerLink="/login">Sign in instead</a>

          <button mat-raised-button color="primary" type="button">
            Next
          </button>
        </div>

      </form>
    </div>

  </mat-card>
</div>

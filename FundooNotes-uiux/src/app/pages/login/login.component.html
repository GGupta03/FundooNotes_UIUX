<div class="auth-wrapper">
  <div class="auth-card">

    <img class="google-logo" src="assets/images/google-logo.png" alt="Google Logo" />

    <div class="title">Login</div>
    <div class="subtitle">Use your Google Account</div>

    <div class="input-group">
      <input class="auth-input" type="text" placeholder="Email or phone*" />
      <input class="auth-input" type="password" placeholder="Password*" />
    </div>

    <div class="links-row">
      <a class="link-blue" href="#">forgot Password?</a>
    </div>

    <div class="bottom-row">
      <a class="link-blue" routerLink="/register">Create account</a>

      <button class="login-btn">Login</button>
    </div>

  </div>
</div>
